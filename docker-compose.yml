version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - CORS_ORIGINS=["http://localhost:3000"]
      - DATABASE_URL=sqlite:///./data/asl_vision.db
    volumes:
      # Persist the SQLite DB, uploaded images, and (crucially) the trained
      # model checkpoint across container restarts/rebuilds -- none of
      # these should be baked into the image itself.
      - backend_data:/srv/data
      - ./backend/ml_pipeline/checkpoints:/srv/ml_pipeline/checkpoints
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Browser-side calls go to localhost:8000 directly (not the internal
      # Docker network name), since NEXT_PUBLIC_* vars are baked in at
      # BUILD time and run in the user's browser, not inside the container.
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_data:

# One-command startup:
#   docker compose up --build
#
# NOTE: this starts the full app, but /predict will return 503 until a
# trained model checkpoint exists at
# backend/ml_pipeline/checkpoints/efficientnet_v2_s_baseline/best.pt --
# see the root README's Training section. The bind-mounted checkpoints/
# directory above means you can train locally (outside Docker, where you
# have GPU access) and the running container will pick up the checkpoint
# without a rebuild -- just restart the backend service.
