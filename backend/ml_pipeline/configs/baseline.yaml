name: efficientnet_v2_s_baseline
data:
  data_dir: /content/data/asl_alphabet_raw/asl_alphabet_train/asl_alphabet_train
  image_size: 224
  num_classes: 29
  class_names: null
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  split_seed: 42
  split_indices_path: /content/outputs/split_indices.json
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
  imbalance_strategy: weighted_loss
model:
  architecture: efficientnet_v2_s
  pretrained: true
  dropout: 0.3
  freeze_backbone_epochs: 3
optim:
  optimizer: adamw
  lr: 0.0003
  backbone_lr_multiplier: 0.1
  weight_decay: 0.0001
  scheduler: cosine
  grad_clip_norm: 5.0
train:
  batch_size: 32
  epochs: 5
  early_stopping_patience: 5
  early_stopping_metric: val_f1_macro
  num_workers: 4
  seed: 0
  device: auto
  use_augmentation: true
  log_dir: /content/outputs/tensorboard
  checkpoint_dir: /content/checkpoints
  resume_from: null
  mixed_precision: true
