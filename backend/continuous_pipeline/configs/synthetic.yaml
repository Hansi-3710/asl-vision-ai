name: landmark_transformer_synthetic
data:
  cache_dir: data/synthetic
  labels_path: data/synthetic/labels.json
  vocab_path: data/synthetic/vocab.json
  feature_dim: 258
  max_sequence_length: 64
  train_split: 0.8
  val_split: 0.2
  split_seed: 42
model:
  architecture: landmark_transformer
  d_model: 64
  num_encoder_layers: 2
  num_heads: 4
  dim_feedforward: 128
  dropout: 0.1
  max_position_embeddings: 128
optim:
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.0001
  scheduler: cosine
  grad_clip_norm: 5.0
train:
  batch_size: 16
  epochs: 15
  early_stopping_patience: 5
  num_workers: 0
  seed: 0
  device: auto
  log_every_n_steps: 5
  checkpoint_dir: checkpoints/landmark_transformer_synthetic
  resume_from: null
