name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}

      - name: Install CPU-only torch + dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.3.1 torchvision==0.18.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 app/ ml_pipeline/ tests/ --max-line-length=127 --extend-ignore=E203,W503 --statistics

      - name: Check formatting with black
        run: black --check app/ ml_pipeline/ tests/

      - name: Run tests
        run: pytest tests/ -v --cov=app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --ci

      - name: Build
        run: npm run build

# NOTE: neither job trains or requires a real model checkpoint -- the
# backend job tests API/database/hand-detector-math logic against fakes
# (see backend/tests/conftest.py), and the frontend job builds/tests the
# UI independent of a live backend. Real model training happens outside
# CI (GPU time + the real dataset), per the root README's Training section.
